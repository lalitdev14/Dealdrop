<!doctype html>
<title>DealDrop</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: price-tag motif. Sticky header with search, then route views: home (countdown + categories + top deals) → category list → product (store table + price-history chart). */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --line: #dde1e8;
  --fg: #12151c;
  --fg-2: #4a5160;
  --muted: #747b8a;
  --accent: #d1203a;        /* price-tag red */
  --accent-ink: #ffffff;
  --accent-soft: #fde8eb;
  --good: #137a3f;
  --good-soft: #e2f4e9;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --chart-surface: #fcfcfb;
  --art-bg: #eceff4;
  --art-bg-2: #f7f8fa;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface-2: #1f2430; --line: #2c3342;
    --fg: #eef0f4; --fg-2: #b6bcc9; --muted: #8a92a3;
    --accent: #ff4d63; --accent-ink: #16080b; --accent-soft: #3a1820;
    --good: #4cc77f; --good-soft: #13301f; --warn: #f0b04a; --warn-soft: #33270f;
    --chart-surface: #171b23; --art-bg: #2a303c; --art-bg-2: #343b49;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --surface-2: #1f2430; --line: #2c3342;
  --fg: #eef0f4; --fg-2: #b6bcc9; --muted: #8a92a3;
  --accent: #ff4d63; --accent-ink: #16080b; --accent-soft: #3a1820;
  --good: #4cc77f; --good-soft: #13301f; --warn: #f0b04a; --warn-soft: #33270f;
  --chart-surface: #171b23; --art-bg: #2a303c; --art-bg-2: #343b49;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-tag {
  font: 800 13px/1 var(--f-display); font-stretch: 85%; letter-spacing: .06em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); padding: 7px 10px 7px 16px; position: relative;
  clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%);
}
.brand-tag::before { content: ""; position: absolute; left: 7px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--surface); }
.brand-name { font: 800 20px/1 var(--f-display); font-stretch: 90%; letter-spacing: -.01em; }
.search { flex: 1 1 260px; position: relative; min-width: 0; }
.search input {
  width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); font: inherit; font-size: 14px;
}
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: 0 12px 32px rgba(10, 14, 22, .16); max-height: 60vh; overflow: auto; z-index: 40;
}
.search-results a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; text-decoration: none; border-bottom: 1px solid var(--line); }
.search-results a:last-child { border-bottom: 0; }
.search-results a:hover, .search-results a.on { background: var(--surface-2); }
.search-results small { color: var(--muted); display: block; }
.search-results .empty { padding: 14px; color: var(--muted); }

nav.cats { border-top: 1px solid var(--line); }
nav.cats .wrap { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; padding-block: 6px; scrollbar-width: none; }
nav.cats a { white-space: nowrap; text-decoration: none; font-size: 13px; font-weight: 500; color: var(--fg-2); padding: 6px 12px; border-radius: 999px; }
nav.cats a:hover { background: var(--surface-2); color: var(--fg); }
nav.cats a.on { background: var(--fg); color: var(--bg); }

main { padding-block: 24px 64px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.crumbs a { color: var(--fg-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 52px); font-weight: 900; font-stretch: 80%; line-height: .98; letter-spacing: -.01em; }
h2 { font-size: 22px; font-weight: 800; font-stretch: 90%; }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.sub { color: var(--fg-2); max-width: 62ch; }
section + section { margin-top: 40px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.hero-copy { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.countdown { background: var(--fg); color: var(--bg); border-radius: var(--r); padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.countdown .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.cd-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cd-row div { text-align: center; }
.cd-row b { display: block; font: 700 clamp(26px, 4vw, 38px)/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.cd-row span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .65; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); }
.stats b { display: block; font: 700 22px/1.1 var(--f-mono); color: var(--fg); }
.sample-note { font-size: 12px; color: var(--muted); }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
@media (max-width: 560px) { .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat-card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, transform .15s;
}
.cat-card:hover { border-color: var(--fg-2); transform: translateY(-2px); }
.cat-card .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--fg); }
.cat-card h3 { font-size: 17px; font-weight: 800; font-stretch: 92%; }
.cat-card .meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.cat-card .meta b { color: var(--accent); font-family: var(--f-mono); font-size: 15px; }

/* Deal list */
.deals { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.deal {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; transition: border-color .15s;
}
.deal:hover { border-color: var(--fg-2); }
.deal-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.thumb { width: 54px; height: 54px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--fg-2); }
.tag {
  font: 700 14px/1 var(--f-mono); background: var(--accent); color: var(--accent-ink); padding: 6px 8px 6px 14px; white-space: nowrap;
  clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); position: relative;
}
.tag::before { content: ""; position: absolute; left: 5px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--surface); }
.art-box { position: relative; background: radial-gradient(circle at 50% 40%, var(--art-bg-2), var(--art-bg)); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.deal .art-box { aspect-ratio: 16 / 10; }
.deal .art-box .tag { position: absolute; top: 10px; right: 10px; }
svg.art { width: 62%; height: auto; max-height: 100%; display: block; transition: transform .25s; }
.deal:hover svg.art { transform: scale(1.06) rotate(-1deg); }
.p-art { width: 200px; aspect-ratio: 1; }
.p-art svg.art { width: 82%; }
.s-thumb { width: 40px; height: 40px; flex: none; border-radius: 6px; }
.s-thumb svg.art { width: 86%; }
.art-box.has-pic { background: #fff; }
img.pic { width: 80%; height: 86%; object-fit: contain; display: block; }
.p-art img.pic { width: 88%; }
.s-thumb img.pic { width: 92%; }
.chart-note { padding: 28px 16px; text-align: center; color: var(--fg-2); }
.deal h3 { font: 600 15px/1.3 var(--f-body); }
.deal .brandline { font-size: 12px; color: var(--muted); }
.price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.price { font: 700 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.was { font: 500 13px/1 var(--f-mono); color: var(--muted); text-decoration: line-through; }
.at { font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.spark { width: 100%; height: 34px; display: block; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--fg-2); }

/* Toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--fg-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(10, 14, 22, .12); }
.toolbar label { font-size: 13px; color: var(--muted); }
select { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }

/* Product page */
.p-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: start; margin-bottom: 24px; }
.p-head h1 { font-size: clamp(26px, 4vw, 40px); font-stretch: 85%; }
.best-box { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 16px 18px; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
.best-box .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.best-box .price { font-size: 32px; }
.best-box .store { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer; }
.p-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.kpi small { display: block; font-size: 12px; color: var(--muted); }
.kpi b { font: 700 20px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi span { display: block; font-size: 12px; color: var(--fg-2); }
.verdict { display: flex; gap: 12px; align-items: start; padding: 14px 16px; border-radius: var(--r); }
.verdict.good { background: var(--good-soft); color: var(--good); }
.verdict.warn { background: var(--warn-soft); color: var(--warn); }
.verdict p { margin: 2px 0 0; color: var(--fg-2); font-size: 14px; }
.verdict strong { font-size: 15px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.best td { background: var(--accent-soft); }
tr.best td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.store-cell { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 6px; border-radius: 4px; }
.disc { font: 700 14px/1 var(--f-mono); color: var(--accent); }

/* Chart */
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg); }
.legend button.off { opacity: .45; }
.legend button.off .dot { background: transparent !important; box-shadow: inset 0 0 0 2px var(--muted); }
.chart { position: relative; background: var(--chart-surface); }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--f-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bf { fill: var(--accent-soft); }
.chart .bf-lbl { fill: var(--accent); font-weight: 700; }
.chart .msrp { stroke: var(--fg-2); stroke-dasharray: 4 4; stroke-width: 1; }
.chart .cross { stroke: var(--fg-2); stroke-width: 1; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(10, 14, 22, .18); min-width: 170px; z-index: 5;
}
.tip .d { font-weight: 600; margin-bottom: 6px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .row span:first-child { display: flex; align-items: center; gap: 6px; color: var(--fg-2); }
.tip .row b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-block: 20px; }

@media (max-width: 820px) {
  .hero, .p-head { grid-template-columns: minmax(0, 1fr); }
  .p-art { width: 100%; aspect-ratio: 16 / 10; }
  .p-art svg.art { width: auto; height: 86%; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .best-box { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="DealDrop home">
      <span class="brand-tag">Black Friday</span>
      <span class="brand-name">DealDrop</span>
    </a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search products, brands, categories" autocomplete="off" aria-label="Search deals">
      <div class="search-results" id="results" hidden></div>
    </div>
  </div>
  <nav class="cats" aria-label="Categories"><div class="wrap" id="catnav"></div></nav>
</header>

<main class="wrap" id="view"></main>

<footer><div class="wrap" id="foot">Prices are sample data generated for this demo, shown as of Nov 15, 2026. Discount = savings against the manufacturer's list price (MSRP). The 90-day low checks whether a "deal" is really the cheapest the item has been.</div></footer>

<script id="price-data" type="application/json">null</script>
<script>
(() => {
  /* ---------- deterministic sample data ---------- */
  let seed = 20261127;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];

  let END = new Date(2026, 10, 15);
  let MODE = "sample", META = {};
  const BF = new Date(2026, 10, 27);
  let DAYS = 90;
  const dateAt = i => { if (MODE === "live") return new Date(META.dates[i] + "T12:00:00"); const d = new Date(END); d.setDate(d.getDate() - (DAYS - 1 - i)); return d; };
  const fmtDate = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });

  let STORES = [
    { id: "northgate", name: "Northgate", c: "--s1" },
    { id: "voltmart", name: "Voltmart", c: "--s2" },
    { id: "shopridge", name: "ShopRidge", c: "--s3" },
    { id: "kestrel", name: "Kestrel & Co", c: "--s4" },
    { id: "bazaarly", name: "Bazaarly", c: "--s5" },
  ];
  let storeById = Object.fromEntries(STORES.map(s => [s.id, s]));

  const ICONS = {
    tv: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
    laptop: '<rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
    phone: '<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
    game: '<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="6"/>',
    audio: '<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>',
    home: '<path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/>',
    kitchen: '<path d="M6 3v8a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2 6 0 8v10"/>',
    fashion: '<path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c0 2-2 3-4 3S8 5 8 3z"/>',
    beauty: '<rect x="9" y="9" width="6" height="12" rx="1"/><path d="M10 9V5l4-2v6"/>',
    toys: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
    sports: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9 8 5h3"/>',
    watch: '<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6V2h6v4M9 18v4h6v-4M12 10v2l1.5 1.5"/>',

  const productArt = (p, cls = "") => {
    const u = "a" + (artUid++);
    const kind = kindOf(p.name);
    if (kind === "box") return `<svg class="art" viewBox="0 0 120 120" role="img" aria-label="${esc(p.brand + " " + p.name)}"><g transform="translate(24 20) scale(3)" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.ico] || ICONS.tv}</g></svg>`;
    const c = FINISHES[[...p.id].reduce((s, ch) => s + ch.charCodeAt(0), 0) % FINISHES.length];
    const body = DRAW[kind](c, u).replace(/__S/g, u + "s");
    return `<svg class="art ${cls}" viewBox="0 0 120 120" role="img" aria-label="${esc(p.brand + " " + p.name)}">
      <defs>
        <linearGradient id="${u}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a5a"/><stop offset=".55" stop-color="#6a4cff"/><stop offset="1" stop-color="#ff7ab0"/></linearGradient>

        <linearGradient id="${u}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c, 0.25)}"/><stop offset="1" stop-color="${shade(c, -0.2)}"/></linearGradient>
      </defs>
      <ellipse cx="60" cy="108" rx="40" ry="4" fill="#000" opacity=".12"/>${body}</svg>`;
  };
  /* Real product photo when the data has one (falls back to the drawing if it fails to load). */
  const artBox = (p, cls = "", extra = "") => p.image
    ? `<div class="art-box has-pic ${cls}"><img class="pic" src="${esc(p.image)}" alt="${esc(p.brand + " " + p.name)}" loading="lazy" referrerpolicy="no-referrer"><span class="pic-fb" hidden>${productArt(p)}</span>${extra}</div>`
    : `<div class="art-box ${cls}">${productArt(p)}${extra}</div>`;
  document.addEventListener("error", e => {
    const t = e.target;
    if (t && t.matches && t.matches("img.pic")) { t.hidden = true; t.parentNode.classList.remove("has-pic"); t.nextElementSibling.hidden = false; }
  }, true);


  const verdictOf = p => {
    const now = p.best.now;
    if (p.low90 == null || DAYS - p.firstIdx < 7) return { k: "neutral", t: "Tracking since " + fmtDate(dateAt(p.firstIdx)), fresh: true };
    if (now <= p.low90 + 0.01) return { k: "good", t: "Lowest in 90 days" };
    if (now <= p.low90 * 1.04) return { k: "neutral", t: "Near 90-day low" };
    return { k: "warn", t: "Was cheaper before" };
  };

  const sparkline = (p, w = 240, h = 34) => {
    const series = p.best.hist;
    const lo = Math.min(...vals(series)), hi = Math.max(...vals(series), p.msrp);
    const x = i => DAYS > 1 ? (i / (DAYS - 1)) * w : 0, y = v => h - 3 - ((v - lo) / (hi - lo || 1)) * (h - 6);
    let d = "", pen = false;
    series.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    if (vals(series).length < 2) d = `M0,${y(p.best.now).toFixed(1)}L${w},${y(p.best.now).toFixed(1)}`;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${series.includes(null) ? "" : d + `L${w},${h}L0,${h}Z`}" fill="var(${storeById[p.best.store].c})" opacity=".12"/>
      <path d="${d}" fill="none" stroke="var(${storeById[p.best.store].c})" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>`;
  };

  const dealCard = p => {
    const v = verdictOf(p);

  /* ---------- chart ---------- */
  let currentChart = null;
  const niceStep = span => { const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / mag; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag; };

  function drawChart(p, state) {
    const host = $("#chart"); if (!host) return;
    const W = Math.max(300, host.clientWidth), H = W < 520 ? 240 : 300;
    const m = { t: 16, r: 14, b: 28, l: W < 520 ? 48 : 58 };
    const start = Math.max(0, DAYS - state.range);
    if (DAYS - start < 2) { host.innerHTML = `<div class="chart-note">Price history builds up with each daily check. First price recorded ${fmtDate(dateAt(DAYS - 1))}; the trend line appears after the next update.</div>`; currentChart = () => {}; return; }
    const offers = p.offers.filter(o => !state.hidden.has(o.store));
    const vs = offers.flatMap(o => vals(o.hist.slice(start))).concat([p.msrp]);
    const step = niceStep(Math.max(...vs) - Math.min(...vs) || p.msrp * 0.1);
    const lo = Math.max(0, Math.floor(Math.min(...vs) / step) * step), hi = Math.ceil(Math.max(...vs) / step) * step;
    const x = i => m.l + ((i - start) / (DAYS - 1 - start)) * (W - m.l - m.r);
    const y = v => m.t + (1 - (v - lo) / (hi - lo || 1)) * (H - m.t - m.b);
    let g = "";
    for (let v = lo; v <= hi + 1e-6; v += step) {
      g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">$${Math.round(v).toLocaleString()}</text>`;
    }
    const tickEvery = Math.max(1, Math.round((DAYS - 1 - start) / 4));

    g += `<line class="msrp" x1="${m.l}" x2="${W - m.r}" y1="${y(p.msrp)}" y2="${y(p.msrp)}"/><text x="${m.l + 4}" y="${y(p.msrp) - 5}">MSRP ${money(p.msrp)}</text>`;
    // step lines: later offers (pricier) first so the best sits on top
    [...offers].reverse().forEach(o => {
      let d = "", pen = false;
      for (let i = start; i < DAYS; i++) {
        if (o.hist[i] == null) { pen = false; continue; }
        const xx = x(i), yy = y(o.hist[i]);
        d += pen ? `H${xx}V${yy}` : `M${xx},${yy}`; pen = true;

      g += `<path d="${d}" fill="none" stroke="var(--chart-surface)" stroke-width="5" stroke-linejoin="round"/>`;
      g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
      g += `<circle cx="${x(DAYS - 1)}" cy="${y(o.now)}" r="4.5" fill="${col}" stroke="var(--chart-surface)" stroke-width="2"/>`;
    });
    g += `<g id="hover" style="display:none"><line class="cross" id="hx" y1="${m.t}" y2="${H - m.b}"/><g id="hdots"></g></g>`;
    g += `<rect id="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history for ${esc(p.name)} over ${DAYS - start} days">${g}</svg><div class="tip" hidden></div>`;

    const hit = host.querySelector("#hit"), hov = host.querySelector("#hover"), tip = host.querySelector(".tip");
    const move = ev => {
      const r = host.getBoundingClientRect();
      const px = ev.clientX - r.left;
      const i = Math.max(start, Math.min(DAYS - 1, Math.round(start + ((px - m.l) / (W - m.l - m.r)) * (DAYS - 1 - start))));
      hov.style.display = "";
      host.querySelector("#hx").setAttribute("x1", x(i)); host.querySelector("#hx").setAttribute("x2", x(i));
      host.querySelector("#hdots").innerHTML = offers.filter(o => o.hist[i] != null).map(o => `<circle cx="${x(i)}" cy="${y(o.hist[i])}" r="4" fill="var(${storeById[o.store].c})" stroke="var(--chart-surface)" stroke-width="2"/>`).join("");
      const rows = offers.filter(o => o.hist[i] != null).sort((a, b) => a.hist[i] - b.hist[i]);
      tip.innerHTML = `<div class="d">${dateAt(i).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}</div>` +
        rows.map(o => `<div class="row"><span>${storeDot(o.store)}${storeById[o.store].name}</span><b>${money(o.hist[i])}</b></div>`).join("");
      tip.hidden = false;
      const tw = tip.offsetWidth;
      let left = x(i) + 14; if (left + tw > W) left = x(i) - tw - 14;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = m.t + "px";
    };
    hit.addEventListener("pointermove", move);
    hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", () => { hov.style.display = "none"; tip.hidden = true; });
  }

      el.innerHTML = ms ? [[d, "days"], [h, "hrs"], [mi, "min"], [s, "sec"]].map(([n, l]) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`).join("")
        : `<div style="grid-column:1/-1"><b>LIVE</b><span>Black Friday deals are on</span></div>`;
    };
    run(); cdTimer = setInterval(run, 1000);
  }

  /* ---------- search ---------- */
  const q = $("#q"), res = $("#results");
  let sel = -1;
  const doSearch = () => {
    const t = q.value.trim().toLowerCase();
    if (!t) { res.hidden = true; return; }
    const cats = CATS.filter(c => c.name.toLowerCase().includes(t)).map(c => ({ href: "#c-" + c.id, a: c.name, b: "Category", r: "" }));
    const ps = PRODUCTS.filter(p => (p.brand + " " + p.name + " " + catById[p.cat].name).toLowerCase().includes(t))
      .sort((a, b) => b.disc - a.disc).slice(0, 8)
      .map(p => ({ img: artBox(p, "s-thumb"), href: "#p-" + p.id, a: p.brand + " " + p.name, b: catById[p.cat].name + " · best at " + storeById[p.best.store].name, r: "-" + pct(p.disc) }));

    res.innerHTML = all.length ? all.map(r => `<a href="${r.href}"><span style="display:flex;gap:10px;align-items:center;min-width:0">${r.img || ""}<span>${esc(r.a)}<small>${esc(r.b)}</small></span></span><span class="disc">${r.r}</span></a>`).join("")

    const links = [...res.querySelectorAll("a")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!links.length) return;
      sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
      links.forEach((l, i) => l.classList.toggle("on", i === sel));
    } else if (e.key === "Enter") {
      const l = links[sel >= 0 ? sel : 0]; if (l) { location.hash = l.getAttribute("href"); q.blur(); res.hidden = true; }
    } else if (e.key === "Escape") { res.hidden = true; q.blur(); }
  });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; else if (e.target.closest(".search-results a")) { res.hidden = true; q.value = ""; } });

  /* ---------- router ---------- */
  const route = () => {
    const h = location.hash.slice(1);
    currentChart = null;
    if (h.startsWith("c-")) viewCat(h.slice(2));
    else if (h.startsWith("p-")) viewProduct(h.slice(2));
    else viewHome();
    window.scrollTo(0, 0);
  };
  window.addEventListener("hashchange", route);

  /* ---------- boot: real prices if available, else sample ---------- */
  (async () => {
    let data = null;
    try { const r = await fetch("data/prices.json", { cache: "no-store" }); if (r.ok) data = await r.json(); } catch (e) {}
    if (!data || !data.products || !data.products.length) { try { data = JSON.parse(document.getElementById("price-data").textContent); } catch (e) {} }
    if (data && data.products && data.products.length && data.dates && data.dates.length) loadLive(data); else loadSample();
    if (MODE === "live") {
      $("#foot").textContent = `Prices from ${STORES.map(st => st.name).join(" and ")}, checked daily (last check ${new Date(META.updatedAt).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}). Discount = savings against the store's regular price. The 90-day low checks whether a deal is really the cheapest the item has been while we've tracked it. Prices can change at any time; confirm on the store's site before buying.`;
    }
    route();
  })();
})();
</script>
