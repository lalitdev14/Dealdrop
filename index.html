<!doctype html>
<title>DealDrop</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: price-tag motif. Sticky header with search, then route views: home (countdown + categories + top deals) → category list → product (store table + price-history chart). */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f5f7;
  --line: #e8eaee;
  --fg: #12151c;
  --fg-2: #4a5160;
  --muted: #636a78;
  --accent: #d1203a;        /* price-tag red */
  --accent-ink: #ffffff;
  --accent-soft: #fde8eb;
  --good: #137a3f;
  --good-soft: #e2f4e9;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --chart-surface: #fcfcfb;
  --art-bg: #eceff4;
  --art-bg-2: #f7f8fa;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --f-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1760px; margin: 0 auto; padding-left: max(clamp(16px, 3vw, 56px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3vw, 56px), env(safe-area-inset-right, 0px)); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-name { font: 700 21px/1 var(--f-display); letter-spacing: -.02em; }
.brand-name em { font-style: normal; color: var(--accent); }
.search { flex: 1 1 260px; position: relative; min-width: 0; }
.search input {
  width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); font: inherit; font-size: 14px;
}
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: 0 12px 32px rgba(10, 14, 22, .16); max-height: 60vh; overflow: auto; z-index: 40;
}
.search-results a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; text-decoration: none; border-bottom: 1px solid var(--line); }
.search-results a:last-child { border-bottom: 0; }
.search-results a:hover, .search-results a.on { background: var(--surface-2); }
.search-results small { color: var(--muted); display: block; }
.search-results .empty { padding: 14px; color: var(--muted); }

nav.cats { border-top: 1px solid var(--line); }
nav.cats .wrap { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; padding-block: 6px; scrollbar-width: none; }
nav.cats a { white-space: nowrap; text-decoration: none; font-size: 13px; font-weight: 500; color: var(--fg-2); padding: 6px 12px; border-radius: 999px; }
nav.cats a:hover { background: var(--surface-2); color: var(--fg); }
nav.cats a.on { background: var(--fg); color: var(--bg); }

main { padding-block: clamp(20px, 3vw, 40px) 64px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.crumbs a { color: var(--fg-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 3vw, 40px); font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
h2 { font-size: clamp(18px, 1.6vw, 22px); font-weight: 650; letter-spacing: -.01em; }
.eyebrow { font: 600 13px/1 var(--f-body); color: var(--accent); }
.sub { color: var(--fg-2); max-width: 62ch; }
section + section { margin-top: 40px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 760px; }
.hero-copy { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.countdown { display: none; }
.cd-line { margin: 0; font-size: 14px; color: var(--fg-2); }
.cd-line b { font: 600 14px var(--f-mono); color: var(--fg); }
.countdown .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); }
.stats b { display: block; font: 700 22px/1.1 var(--f-mono); color: var(--fg); }
.sample-note { font-size: 12px; color: var(--muted); }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
@media (max-width: 560px) { .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat-card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, transform .15s;
}
.cat-card:hover { border-color: var(--fg-2); transform: translateY(-2px); }
.cat-card .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--fg); }
.cat-card h3 { font-size: 17px; font-weight: 800; }
.cat-card .meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.cat-card .meta b { color: var(--accent); font-family: var(--f-mono); font-size: 15px; }

/* Deal list */
.deals { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: clamp(12px, 1.2vw, 20px); }
.deal {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; transition: border-color .15s;
}
.deal:hover { border-color: #d3d7de; box-shadow: 0 6px 20px rgba(16, 24, 40, .06); }
.deal-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.thumb { width: 54px; height: 54px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--fg-2); }
.tag { font: 600 13px/1 var(--f-body); background: var(--accent); color: var(--accent-ink); padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.art-box { position: relative; background: radial-gradient(circle at 50% 40%, var(--art-bg-2), var(--art-bg)); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.deal .art-box { aspect-ratio: 4 / 3; }
.deal .art-box .tag { position: absolute; top: 10px; right: 10px; }
svg.art { width: 62%; height: auto; max-height: 100%; display: block; transition: transform .25s; }
.deal:hover svg.art { transform: scale(1.06) rotate(-1deg); }
.p-art { width: 200px; aspect-ratio: 1; }
.p-art svg.art { width: 82%; }
.s-thumb { width: 40px; height: 40px; flex: none; border-radius: 6px; }
.s-thumb svg.art { width: 86%; }
.art-box.has-pic { background: #fff; }
img.pic { width: 80%; height: 86%; object-fit: contain; display: block; }
.p-art img.pic { width: 88%; }
.s-thumb img.pic { width: 92%; }
.chart-note { padding: 28px 16px; text-align: center; color: var(--fg-2); }
.my-alerts { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.my-alerts:hover { border-color: var(--fg-2); }
.my-alerts .count { background: var(--accent); color: var(--accent-ink); font: 700 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 999px; }
.alert-panel form { display: flex; flex-direction: column; gap: 12px; }
.af-row { display: grid; grid-template-columns: minmax(0, 180px) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.af-row.no-email { grid-template-columns: minmax(0, 220px) auto; justify-content: start; }
.af-row label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg-2); min-width: 0; }
.af-row input { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; min-width: 0; }
.af-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.money-input { position: relative; }
.money-input span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-mono); }
.money-input input { padding-left: 26px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.af-quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.af-quick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--fg); font-family: var(--f-mono); }
.af-quick button:hover { border-color: var(--fg-2); }
.af-msg { margin: 0; font-size: 14px; min-height: 1.5em; }
.af-msg.err { color: var(--accent); }
.af-msg.ok { color: var(--good); }
.af-status { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14px; }
.linkish { border: 0; background: none; padding: 0; color: var(--fg-2); text-decoration: underline; cursor: pointer; font-size: 13px; }
.alert-list { display: flex; flex-direction: column; gap: 10px; }
.alert-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-decoration: none; }
.alert-row:hover { border-color: var(--fg-2); }
.alert-row .art-box { width: 64px; height: 64px; }
.alert-row h3 { font: 600 15px/1.3 var(--f-body); margin: 0 0 4px; }
.alert-row .meta { font-size: 13px; color: var(--fg-2); display: flex; gap: 10px; flex-wrap: wrap; }
.alert-row .right { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: end; }
.notice { max-width: 560px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.notice h1 { font-size: 30px; }
.notice p { margin: 0; color: var(--fg-2); }
.btn.secondary { background: var(--surface-2); color: var(--fg); }
.deal h3 { font: 600 15px/1.3 var(--f-body); }
.deal .brandline { font-size: 12px; color: var(--muted); }
.price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.price { font: 700 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.was { font: 500 13px/1 var(--f-mono); color: var(--muted); text-decoration: line-through; }
.at { font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.spark { width: 100%; height: 34px; display: block; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--fg-2); }

/* Toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--fg-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(10, 14, 22, .12); }
.toolbar label { font-size: 13px; color: var(--muted); }
select { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }

/* Product page */
.p-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: start; margin-bottom: 24px; }
.p-head h1 { font-size: clamp(26px, 4vw, 40px); }
.best-box { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 16px 18px; min-width: 240px; display: flex; flex-direction: column; gap: 8px; }
.best-box .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.best-box .price { font-size: 32px; }
.best-box .store { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer; }
.p-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.kpi small { display: block; font-size: 12px; color: var(--muted); }
.kpi b { font: 700 20px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi span { display: block; font-size: 12px; color: var(--fg-2); }
.verdict { display: flex; gap: 12px; align-items: start; padding: 14px 16px; border-radius: var(--r); }
.verdict.good { background: var(--good-soft); color: var(--good); }
.verdict.warn { background: var(--warn-soft); color: var(--warn); }
.verdict p { margin: 2px 0 0; color: var(--fg-2); font-size: 14px; }
.verdict strong { font-size: 15px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.best td { background: var(--accent-soft); }
tr.best td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.store-cell { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 6px; border-radius: 4px; }
.disc { font: 700 14px/1 var(--f-mono); color: var(--accent); }

/* Chart */
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg); }
.legend button.off { opacity: .45; }
.legend button.off .dot { background: transparent !important; box-shadow: inset 0 0 0 2px var(--muted); }
.chart { position: relative; background: var(--chart-surface); }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--f-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bf { fill: var(--accent-soft); }
.chart .bf-lbl { fill: var(--accent); font-weight: 700; }
.chart .msrp { stroke: var(--fg-2); stroke-dasharray: 4 4; stroke-width: 1; }
.chart .cross { stroke: var(--fg-2); stroke-width: 1; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(10, 14, 22, .18); min-width: 170px; z-index: 5;
}
.tip .d { font-weight: 600; margin-bottom: 6px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .row span:first-child { display: flex; align-items: center; gap: 6px; color: var(--fg-2); }
.tip .row b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
/* Hot deals from every store */
.hot { cursor: default; }
.hot .art-box { aspect-ratio: 4 / 3; text-decoration: none; background: #fff; }
.hot .art-box img.pic { width: 86%; height: 86%; }
.hot h3 a { text-decoration: none; }
.hot h3 a:hover { text-decoration: underline; }
.hot .tag.soft { background: var(--surface-2); color: var(--fg); }
.hot-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hot-actions .btn { flex: 1 1 auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
.hot-actions .btn:hover { background: var(--fg); color: #fff; border-color: var(--fg); }
.code-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--fg); border-radius: 8px; padding: 8px 10px; font: 700 13px/1 var(--f-mono); cursor: pointer; }
.code-btn small { font: 500 11px/1 var(--f-body); color: var(--fg-2); }
.src { font-size: 12px; color: var(--fg-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.src a { color: var(--fg-2); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--fg-2); }
.chips button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
@media (max-width: 600px) {
  .deals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .deal { padding: 10px; gap: 8px; }
  .deal h3 { font-size: 13.5px; }
  .price { font-size: 17px; }
  .hot-actions .btn { font-size: 13px; padding: 8px 10px; }
  .code-btn { padding: 6px 8px; font-size: 12px; }
}
.disclose { font-size: 12px; color: var(--fg-2); margin: 10px 0 0; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-block: 20px; }

@media (max-width: 820px) {
  .hero, .p-head { grid-template-columns: minmax(0, 1fr); }
  .p-art { width: 100%; aspect-ratio: 16 / 10; }
  .p-art svg.art { width: auto; height: 86%; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .best-box { min-width: 0; }
  .af-row, .af-row.no-email { grid-template-columns: minmax(0, 1fr); }
  .alert-row { grid-template-columns: 52px minmax(0, 1fr); }
  .alert-row .art-box { width: 52px; height: 52px; }
  .alert-row .right { grid-column: 2; align-items: start; text-align: left; flex-direction: row; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="DealDrop home">
      <span class="brand-name">Deal<em>Drop</em></span>
    </a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search products, brands, categories" autocomplete="off" aria-label="Search deals">
      <div class="search-results" id="results" hidden></div>
    </div>

    { id: "phones", name: "Phones & Wearables", ico: "phone", items: [

    { id: "home", name: "Smart Home", ico: "home", items: [
      ["Hearth", "Video Doorbell 4", 229], ["Hearth", "Smart Thermostat 3rd Gen", 249], ["Brisa", "Mesh Wi-Fi 6E (3-pack)", 449],
      ["Lumetra", "Smart Bulb Starter Kit", 199], ["Hearth", "Indoor Security Cam 2K", 79], ["Cleanly", "Robot Vacuum + Mop S8", 899] ] },
    { id: "kitchen", name: "Kitchen & Appliances", ico: "kitchen", items: [

    { id: "toys", name: "Toys & Kids", ico: "toys", items: [

    { id: "watches", name: "Watches & Jewelry", ico: "watch", items: [

      ["Marlow", "Lab Diamond Stud Earrings", 899], ["Halden", "Chronograph Steel Bracelet", 399], ["Tempo", "Hybrid Smart Watch 38mm", 199] ] },
    { id: "sports", name: "Sports & Outdoors", ico: "sports", items: [
      ["Peakline", "Smart Indoor Bike", 1499], ["Peakline", "Adjustable Dumbbells 52lb", 429], ["Trailo", "4-Person Camping Tent", 349],
      ["Trailo", "Insulated Bottle 32oz", 45], ["Peakline", "Massage Gun Pro", 299], ["Trailo", "E-Scooter 25mi Range", 799] ] },
  ];

  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const round99 = v => v < 20 ? Math.round(v * 100) / 100 : Math.max(1, Math.round(v)) - 0.01;

  let PRODUCTS = [], byId = {}, catById = {};
  const vals = a => a.filter(v => v != null);

  /* Turns raw { msrp, offers: [{ store, url?, hist: [price|null per day] }] } into ranked offers + stats. */
  const finalize = p => {
    const offers = p.offers.map(o => {
      const now = o.hist[o.hist.length - 1];
      if (now == null) return null;                       // not sold / out of stock today
      return { ...o, now, disc: (p.msrp - now) / p.msrp, low90: Math.min(...vals(o.hist)) };
    }).filter(Boolean).sort((a, b) => a.now - b.now);
    if (!offers.length || !(p.msrp > 0)) return null;
    const prev = offers.flatMap(o => vals(o.hist.slice(0, -1)));
    let firstIdx = DAYS - 1;
    offers.forEach(o => { const i = o.hist.findIndex(v => v != null); if (i >= 0 && i < firstIdx) firstIdx = i; });
    const best = offers[0];
    return { ...p, ico: (catById[p.cat] || {}).ico || "tv", offers, best, firstIdx,
      low90: prev.length ? Math.min(...prev) : null, disc: best.disc, save: p.msrp - best.now };
  };
  const setProducts = raw => {
    catById = Object.fromEntries(CATS.map(c => [c.id, c]));
    PRODUCTS = raw.map(finalize).filter(Boolean);
    byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
    CATS = CATS.filter(c => PRODUCTS.some(p => p.cat === c.id));
  };

  function loadLive(d) {
    MODE = "live"; META = d;
    DAYS = d.dates.length;
    END = new Date(d.dates[DAYS - 1] + "T12:00:00");
    STORES = d.stores.map((st, i) => ({ ...st, c: "--s" + (st.color || (i % 5) + 1) }));
    storeById = Object.fromEntries(STORES.map(st => [st.id, st]));
    CATS = d.categories;
    setProducts(d.products);
  }

  function loadSample() {
  const RAW = [];
  CATS.forEach(cat => {
    cat.items.forEach(([brand, name, msrp]) => {
      const nStores = 3 + Math.floor(rnd() * 3);
      const pool = [...STORES].sort(() => rnd() - 0.5).slice(0, nStores).sort((a, b) => STORES.indexOf(a) - STORES.indexOf(b));
      const depth = 0.12 + rnd() * 0.42;         // how deep the BF discount goes for this item
      const fakeStore = rnd() < 0.45 ? pick(pool).id : null; // one store inflates its price before "discounting"
      const offers = pool.map(st => {
        let base = msrp * (0.9 + rnd() * 0.1);
        const hist = [];
        const promoDay = Math.floor(rnd() * 60);
        const promoLen = 4 + Math.floor(rnd() * 6);
        const promoCut = rnd() < 0.3 ? Math.min(0.65, depth * (0.95 + rnd() * 0.4)) : 0.05 + rnd() * 0.18;
        const earlyStart = 72 + Math.floor(rnd() * 14);
        const myDepth = Math.min(0.7, depth * (0.65 + rnd() * 0.5));
        for (let i = 0; i < DAYS; i++) {
          let p = base;
          if (i % 9 === 0) base = msrp * (0.88 + rnd() * 0.12);
          if (i >= promoDay && i < promoDay + promoLen) p = base * (1 - promoCut);
          if (st.id === fakeStore && i >= 50 && i < earlyStart) p = msrp * 1.08;
          if (i >= earlyStart) p = msrp * (1 - myDepth * (i >= 86 ? 1 : 0.8));
          hist.push(round99(p));
        }
        return { store: st.id, hist };
      });
      RAW.push({ id: slug(brand + " " + name).slice(0, 48), cat: cat.id, brand, name, msrp, offers });
    });
  });
  setProducts(RAW);
  }

  /* ---------- helpers ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = v => "$" + v.toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const pct = v => Math.round(v * 100) + "%";
  const cvar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const storeList = () => { const n = STORES.map(st => st.name); return n.length > 1 ? n.slice(0, -1).join(", ") + " and " + n[n.length - 1] : n[0]; };
  const storeDot = id => `<span class="dot" style="background:var(${storeById[id].c})"></span>`;

  /* ---------- affiliate links: every outbound store link carries DealDrop's code when one is configured ---------- */
  let CFG = {};
  const affiliateOn = () => !!(CFG.amazonTag || CFG.sovrnKey);
  const isAmazon = h => /(^|\.)amazon\.(com|ca|co\.uk|de|fr|it|es|co\.jp|in|com\.mx|com\.au)$/.test(h) || h === "amzn.to";
  const monetize = url => {
    if (!url) return url;
    let u; try { u = new URL(url); } catch (e) { return url; }
    if (/(^|\.)(slickdeals\.net|dealnews\.com|reddit\.com)$/.test(u.hostname)) return url;   // source pages, not stores
    if (isAmazon(u.hostname)) {
      if (CFG.amazonTag) { u.searchParams.set("tag", CFG.amazonTag); return u.toString(); }
    } else if (u.searchParams.has("tag") || /impact|cj\.com|anrdoezrs|dpbolvw|jdoqocy|kqzyfj|tkqlhce|linksynergy|awin1|sjv\.io|pxf\.io|goto\./.test(u.hostname)) {
      return url;                                                                             // already an affiliate link
    }
    if (CFG.sovrnKey) return `https://redirect.viglink.com/?key=${encodeURIComponent(CFG.sovrnKey)}&u=${encodeURIComponent(url)}`;
    return url;
  };

  /* ---------- hot deals from every store (data/deals.json) ---------- */
  let HOT = [], HOT_META = null, hotCatById = {};
  const hotLink = d => d.url ? {                    // always straight to the store, with our affiliate code when configured
    href: d.affiliate ? d.url : monetize(d.url),
    label: `${d.linkType === "search" ? "Find it" : "Get deal"}${d.store ? " at " + d.store : ""}`,
    rel: "sponsored noopener",
  } : null;
  const updatedAgo = () => HOT_META ? ago(HOT_META.updatedAt) : "recently";
  const ago = iso => { const m = Math.max(0, (Date.now() - new Date(iso)) / 6e4); return m < 2 ? "just now" : m < 60 ? Math.round(m) + " min ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
  const hotCard = (d, rank) => {
    const l = hotLink(d);
    const off = d.pct ? `<span class="tag">${d.upTo ? "up to " : ""}-${pct(d.pct)}</span>` : rank != null && rank < 3 ? `<span class="tag soft">#${rank + 1} hot</span>` : "";
    const a = (inner, cls = "") => l ? `<a class="${cls}" href="${esc(l.href)}" target="_blank" rel="${l.rel}">${inner}</a>` : inner;
    const img = d.image ? `<img class="pic" src="${esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : icon("tv", 40);
    return `<article class="deal hot" data-cat="${esc(d.cat || "")}" data-store="${esc(d.store || "")}">
      ${a(`${img}${off}`, "art-box" + (d.image ? " has-pic" : ""))}
      <div><div class="brandline">${esc(d.store || "Online")} · ${ago(d.posted)}</div><h3>${a(esc(d.name || d.title))}</h3></div>
      <div class="price-row">${d.price != null ? `<span class="price">${d.upTo ? "from " : ""}${money(d.price)}</span>` : ""}${d.was ? `<span class="was">${money(d.was)}</span>` : ""}${d.freeShip ? '<span class="pill good">Free shipping</span>' : ""}</div>
      <div class="hot-actions">
        ${d.code ? `<button class="code-btn" data-code="${esc(d.code)}" title="Copy promo code">${esc(d.code)} <small>copy</small></button>` : ""}
        ${l ? `<a class="btn" href="${esc(l.href)}" target="_blank" rel="${l.rel}">${esc(l.label)} ↗</a>` : ""}
      </div>
    </article>`;
  };
  const wireCodes = () => document.querySelectorAll("[data-code]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.code); } catch (e) {}
    b.querySelector("small").textContent = "copied";
    setTimeout(() => { const s = b.querySelector("small"); if (s) s.textContent = "copy"; }, 1600);
  });
  const discloseNote = () => `<p class="disclose">${affiliateOn() ? "DealDrop may earn a commission when you buy through links on this page, at no extra cost to you. " : ""}Deals change fast; check the price on the store's site.</p>`;

  /* ---------- "for you": learn each visitor's taste from what they click (kept in their own browser) ---------- */
  const TASTE_KEY = "dealdrop-taste";
  const taste = () => { try { return JSON.parse(localStorage.getItem(TASTE_KEY)) || { cat: {}, store: {}, n: 0 }; } catch (e) { return { cat: {}, store: {}, n: 0 }; } };
  const bumpTaste = (cat, store, w = 1) => {
    const t = taste();
    if (cat) t.cat[cat] = (t.cat[cat] || 0) + w;
    if (store) t.store[store] = (t.store[store] || 0) + w;
    t.n = (t.n || 0) + w;
    try { localStorage.setItem(TASTE_KEY, JSON.stringify(t)); } catch (e) {}
  };
  const hasTaste = () => taste().n >= 3;
  // score boosted by the share of this visitor's clicks in the deal's category and store
  const forYou = list => {
    const t = taste(); if (!(t.n >= 3)) return [...list].sort((a, b) => b.score - a.score);
    const share = (m, k) => (m[k] || 0) / t.n;
    return [...list].map(d => ({ d, s: d.score * (1 + 1.2 * share(t.cat, d.cat) + 0.6 * share(t.store, d.store)) })).sort((a, b) => b.s - a.s).map(x => x.d);
  };
  document.addEventListener("click", e => {
    const a = e.target.closest(".hot a[rel~='sponsored']"); if (!a) return;
    const card = a.closest(".hot"); bumpTaste(card.dataset.cat, card.dataset.store);
  });

  const PAGE = 60;
  const hotState = { cat: "all", store: "all", codes: false, sort: "hot", shown: PAGE };
  const viewHot = () => {
    catNav("hot");
    if (!HOT.length) { $("#view").innerHTML = `<section><h1>Hot deals</h1><p class="sub">No deals loaded yet. They refresh every few hours.</p></section>`; return; }
    const cats = HOT_META.categories.filter(c => HOT.some(d => d.cat === c.id));
    const stores = Object.entries(HOT.reduce((m, d) => (d.store && (m[d.store] = (m[d.store] || 0) + 1), m), {})).sort((a, b) => b[1] - a[1]);
    $("#view").innerHTML = `
      <div class="crumbs"><a href="#home">All deals</a><span>/</span><span>Hot deals</span></div>
      <section>
        <div class="sec-head"><div><span class="eyebrow">Every store · updated ${updatedAgo()}</span><h1 style="margin-top:8px">Hot deals right now</h1>
          <p>${HOT.length} deals from ${stores.length} stores, ranked by popularity, discount depth and freshness. Last update ${new Date(HOT_META.updatedAt).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}.</p></div></div>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Sort">
            ${hasTaste() ? '<button data-hsort="you">For you</button>' : ""}<button data-hsort="hot">Hottest</button><button data-hsort="pct">Highest % off</button><button data-hsort="price">Lowest price</button><button data-hsort="new">Newest</button>
          </div>
          <label for="hotStore">Store</label>
          <select id="hotStore"><option value="all">Any store</option>${stores.map(([s, n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join("")}</select>
          <label style="display:flex;gap:6px;align-items:center;color:var(--fg-2)"><input type="checkbox" id="hotCodes"> With promo code</label>
        </div>
        <div class="chips" style="margin-bottom:14px"><button data-hcat="all">All</button>${cats.map(c => `<button data-hcat="${c.id}">${esc(c.name)}</button>`).join("")}</div>
        <div class="deals" id="hot-list"></div>
        <div style="text-align:center;margin-top:20px"><button class="btn secondary" id="hotMore" hidden></button></div>
        ${discloseNote()}
      </section>`;
    const render = () => {
      let ds = HOT.filter(d => (hotState.cat === "all" || d.cat === hotState.cat) && (hotState.store === "all" || d.store === hotState.store) && (!hotState.codes || d.code));
      const s = hotState.sort;
      ds = s === "you" ? forYou(ds) : [...ds].sort((a, b) => s === "pct" ? (b.pct || 0) - (a.pct || 0) : s === "price" ? (a.price ?? 1e9) - (b.price ?? 1e9) : s === "new" ? new Date(b.posted) - new Date(a.posted) : b.score - a.score);
      $("#hot-list").innerHTML = ds.length ? ds.slice(0, hotState.shown).map((d, i) => hotCard(d, s === "hot" && hotState.cat === "all" ? i : null)).join("") : `<p class="sub">No deals match these filters.</p>`;
      const more = $("#hotMore"), left = ds.length - hotState.shown;
      more.hidden = left <= 0; more.textContent = `Show ${Math.min(PAGE, left)} more (${left} left)`;
      more.onclick = () => { hotState.shown += PAGE; render(); };
      document.querySelectorAll("[data-hsort]").forEach(b => b.classList.toggle("on", b.dataset.hsort === s));
      document.querySelectorAll("[data-hcat]").forEach(b => b.classList.toggle("on", b.dataset.hcat === hotState.cat));
      wireCodes();
    };
    if (hotState.sort === "hot" && hasTaste()) hotState.sort = "you";
    if (hotState.sort === "you" && !hasTaste()) hotState.sort = "hot";
    hotState.shown = PAGE;
    document.querySelectorAll("[data-hsort]").forEach(b => b.onclick = () => { hotState.sort = b.dataset.hsort; hotState.shown = PAGE; render(); });
    document.querySelectorAll("[data-hcat]").forEach(b => b.onclick = () => {
      hotState.cat = b.dataset.hcat; hotState.shown = PAGE;
      if (hotState.cat !== "all") bumpTaste(hotState.cat, null, 0.5);       // picking a category is a weaker signal than a click-through
      render();
    });
    if (hotState.store !== "all" && !stores.some(([s]) => s === hotState.store)) hotState.store = "all";
    $("#hotStore").value = hotState.store;
    $("#hotStore").onchange = e => { hotState.store = e.target.value; hotState.shown = PAGE; render(); };
    $("#hotCodes").checked = hotState.codes;
    $("#hotCodes").onchange = e => { hotState.codes = e.target.checked; hotState.shown = PAGE; render(); };
    render();
  };

  const productArt = (p, cls = "") => {
    const u = "a" + (artUid++);
    const kind = kindOf(p.name);
    if (kind === "box") return `<svg class="art" viewBox="0 0 120 120" role="img" aria-label="${esc(p.brand + " " + p.name)}"><g transform="translate(24 20) scale(3)" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.ico] || ICONS.tv}</g></svg>`;
    const c = FINISHES[[...p.id].reduce((s, ch) => s + ch.charCodeAt(0), 0) % FINISHES.length];
    const body = DRAW[kind](c, u).replace(/__S/g, u + "s");
    return `<svg class="art ${cls}" viewBox="0 0 120 120" role="img" aria-label="${esc(p.brand + " " + p.name)}">
      <defs>
        <linearGradient id="${u}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a5a"/><stop offset=".55" stop-color="#6a4cff"/><stop offset="1" stop-color="#ff7ab0"/></linearGradient>
        <linearGradient id="${u}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#a7adb8"/></linearGradient>
        <linearGradient id="${u}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c, 0.25)}"/><stop offset="1" stop-color="${shade(c, -0.2)}"/></linearGradient>
      </defs>
      <ellipse cx="60" cy="108" rx="40" ry="4" fill="#000" opacity=".12"/>${body}</svg>`;
  };
  /* Real product photo when the data has one (falls back to the drawing if it fails to load). */
  const artBox = (p, cls = "", extra = "") => p.image
    ? `<div class="art-box has-pic ${cls}"><img class="pic" src="${esc(p.image)}" alt="${esc(p.brand + " " + p.name)}" loading="lazy" referrerpolicy="no-referrer"><span class="pic-fb" hidden>${productArt(p)}</span>${extra}</div>`
    : `<div class="art-box ${cls}">${productArt(p)}${extra}</div>`;
  document.addEventListener("error", e => {
    const t = e.target;
    if (t && t.matches && t.matches("img.pic")) { t.hidden = true; t.parentNode.classList.remove("has-pic"); if (t.nextElementSibling) t.nextElementSibling.hidden = false; }
  }, true);


  const verdictOf = p => {
    const now = p.best.now;
    if (p.low90 == null || DAYS - p.firstIdx < 7) return { k: "neutral", t: "Tracking since " + fmtDate(dateAt(p.firstIdx)), fresh: true };
    if (now <= p.low90 + 0.01) return { k: "good", t: "Lowest in 90 days" };
    if (now <= p.low90 * 1.04) return { k: "neutral", t: "Near 90-day low" };
    return { k: "warn", t: "Was cheaper before" };
  };

  const sparkline = (p, w = 240, h = 34) => {
    const series = p.best.hist;
    const lo = Math.min(...vals(series)), hi = Math.max(...vals(series), p.msrp);
    const x = i => DAYS > 1 ? (i / (DAYS - 1)) * w : 0, y = v => h - 3 - ((v - lo) / (hi - lo || 1)) * (h - 6);
    let d = "", pen = false;
    series.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    if (vals(series).length < 2) d = `M0,${y(p.best.now).toFixed(1)}L${w},${y(p.best.now).toFixed(1)}`;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${series.includes(null) ? "" : d + `L${w},${h}L0,${h}Z`}" fill="var(${storeById[p.best.store].c})" opacity=".12"/>
      <path d="${d}" fill="none" stroke="var(${storeById[p.best.store].c})" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>`;
  };

  const dealCard = p => {
    const v = verdictOf(p);
    return `<a class="deal" href="#p-${p.id}">
      ${artBox(p, "", `<span class="tag">-${pct(p.disc)}</span>`)}

      ${sparkline(p)}
      <div class="price-row"><span class="price">${money(p.best.now)}</span><span class="was">${money(p.msrp)}</span></div>
      <div class="deal-top" style="align-items:center;flex-wrap:wrap"><span class="at">${storeDot(p.best.store)}Best at ${storeById[p.best.store].name}</span>${(() => { const a = myAlerts()[p.id]; return a && p.best.now <= a.target ? '<span class="pill good">Your target hit</span>' : `<span class="pill ${v.k}">${v.t}</span>`; })()}</div>
    </a>`;
  };

  /* ---------- views ---------- */
  const catNav = active => {
    $("#catnav").innerHTML = `<a href="#home" class="${!active ? "on" : ""}">All deals</a>` +
      (HOT.length ? `<a href="#hot" class="${active === "hot" ? "on" : ""}">Hot deals</a>` : "") +
      CATS.map(c => `<a href="#c-${c.id}" class="${active === c.id ? "on" : ""}">${esc(c.name)}</a>`).join("");
    const on = $("#catnav .on"); if (on && active) on.scrollIntoView({ block: "nearest", inline: "center" });
  };

  let homeSort = "disc";
  const hotSection = (n = 12) => HOT.length ? `
      <section>
        <div class="sec-head">
          <div><h2>Hottest right now</h2><p>Updated ${updatedAgo()}</p></div>
          <a href="#hot" style="font-size:14px;font-weight:600;color:var(--accent);text-decoration:none">See all ${HOT.length} →</a>
        </div>
        <div class="deals">${forYou(HOT).slice(0, n).map((d, i) => hotCard(d, hasTaste() ? null : i)).join("")}</div>
        ${discloseNote()}
      </section>` : "";
  const viewHome = () => {
    catNav(null);
    if (MODE === "sample" && HOT.length) {          // no store price feed yet: lead with real deals, skip the demo products
      const stores = new Set(HOT.map(d => d.store).filter(Boolean)).size;
      const withPct = HOT.filter(d => d.pct && !d.upTo);
      $("#view").innerHTML = `
        <section class="hero">
          <div class="hero-copy">

              <div><b class="num">${HOT.length}</b>live deals</div>
              <div><b class="num">${stores}</b>stores</div>
              <div><b class="num">${withPct.length ? pct(Math.max(...withPct.map(d => d.pct))) : "—"}</b>biggest discount</div>
              <div><b class="num">${HOT.filter(d => d.code).length}</b>promo codes</div>
            </div>
            <p class="cd-line" aria-live="polite">Black Friday (Nov 27) in <b id="cd"></b></p>
          </div>

        </section>
        ${hotSection(24)}`;
      wireCodes(); tick();
      return;
    }
    const top =[...PRODUCTS].sort((a, b) => homeSort === "save" ? b.save - a.save : b.disc - a.disc).slice(0, 12);
    const avg = PRODUCTS.reduce((s, p) => s + p.disc, 0) / PRODUCTS.length;
    const maxD = Math.max(...PRODUCTS.map(p => p.disc));
    const real = PRODUCTS.filter(p => verdictOf(p).k === "good").length;
    $("#view").innerHTML = `
      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">Black Friday 2026 · ${MODE === "live" ? "live prices" : "demo with sample prices"}</span>
          <h1>The deepest markdowns, store by store.</h1>
          <p class="sub">We track ${PRODUCTS.length} ${MODE === "live" ? "of the most discounted products at " + storeList() : "popular products across " + STORES.length + " stores"} and rank them by discount off list price. Open any product to see ${MODE === "live" ? "its price history (up to 90 days, growing daily)" : "90 days of price history"} and which store is cheapest right now.</p>
          <div class="stats">
            <div><b class="num">${pct(maxD)}</b>biggest discount</div>
            <div><b class="num">${pct(avg)}</b>average off MSRP</div>
            <div><b class="num">${real}</b>at a 90-day low</div>
          </div>
          <p class="cd-line" aria-live="polite">Black Friday (Nov 27) in <b id="cd"></b></p>
        </div>

      </section>
      ${hotSection(8)}

      <section>
        <div class="sec-head"><div><h2>Shop by category</h2><p>Pick a category to see every tracked product, sorted by discount.</p></div></div>
        <div class="cat-grid">${CATS.map(c => {
          const ps = PRODUCTS.filter(p => p.cat === c.id);
          return `<a class="cat-card" href="#c-${c.id}"><div class="ico">${icon(c.ico)}</div><h3>${esc(c.name)}</h3>
            <div class="meta"><span>${ps.length} deals</span><span>up to <b>-${pct(Math.max(...ps.map(p => p.disc)))}</b></span></div></a>`;
        }).join("")}</div>
      </section>

      <section>
        <div class="sec-head">
          <div><h2>Highest discounts right now</h2><p>Top 12 across every category, best store price shown.</p></div>
          <div class="seg" role="group" aria-label="Sort top deals">
            <button data-hs="disc" class="${homeSort === "disc" ? "on" : ""}">% off</button>
            <button data-hs="save" class="${homeSort === "save" ? "on" : ""}">$ saved</button>
          </div>
        </div>
        <div class="deals">${top.map(dealCard).join("")}</div>
      </section>
      <p class="sample-note" style="margin-top:24px">${MODE === "live" ? `Prices last checked ${new Date(META.updatedAt).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}. Prices change often; confirm on the store's site.` : "Demo build: products, stores and prices are sample data. Real prices appear after the first daily price update runs."}</p>`;
    document.querySelectorAll("[data-hs]").forEach(b => b.onclick = () => { homeSort = b.dataset.hs; viewHome(); });
    wireCodes(); tick();
  };

  const catState = { sort: "disc", store: "all", realOnly: false };
  const viewCat = id => {
    const c = catById[id]; if (!c) return viewHome();
    catNav(id);
    const render = () => {
      let ps = PRODUCTS.filter(p => p.cat === id);
      if (catState.store !== "all") ps = ps.filter(p => p.best.store === catState.store);
      if (catState.realOnly) ps = ps.filter(p => verdictOf(p).k === "good");
      const s = catState.sort;
      ps.sort((a, b) => s === "price" ? a.best.now - b.best.now : s === "save" ? b.save - a.save : b.disc - a.disc);
      $("#cat-list").innerHTML = ps.length ? ps.map(dealCard).join("") : `<p class="sub">No products match these filters. Try another store or turn off "90-day lows only".</p>`;
    };
    const ps = PRODUCTS.filter(p => p.cat === id);
    const winCounts = STORES.map(st => [st, ps.filter(p => p.best.store === st.id).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
    $("#view").innerHTML = `
      <div class="crumbs"><a href="#home">All deals</a><span>/</span><span>${esc(c.name)}</span></div>
      <section>
        <div class="sec-head">
          <div><span class="eyebrow">Category</span><h1 style="margin-top:8px">${esc(c.name)}</h1>
          <p>${ps.length} tracked products · up to ${pct(Math.max(...ps.map(p => p.disc)))} off · ${winCounts.length ? `cheapest most often at <b>${winCounts[0][0].name}</b> (${winCounts[0][1]} of ${ps.length})` : ""}</p></div>
        </div>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Sort">
            <button data-s="disc">Highest % off</button><button data-s="save">Most $ saved</button><button data-s="price">Lowest price</button>
          </div>
          <label for="storeSel">Best store</label>
          <select id="storeSel"><option value="all">Any store</option>${winCounts.map(([st, n]) => `<option value="${st.id}">${st.name} (${n})</option>`).join("")}</select>
          <label style="display:flex;gap:6px;align-items:center;color:var(--fg-2)"><input type="checkbox" id="realOnly"> 90-day lows only</label>
        </div>
        <div class="deals" id="cat-list"></div>
      </section>`;
    const syncSeg = () => document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === catState.sort));
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { catState.sort = b.dataset.s; syncSeg(); render(); });
    if (!winCounts.some(([st]) => st.id === catState.store)) catState.store = "all";
    $("#storeSel").value = catState.store;
    $("#storeSel").onchange = e => { catState.store = e.target.value; render(); };
    $("#realOnly").checked = catState.realOnly;
    $("#realOnly").onchange = e => { catState.realOnly = e.target.checked; render(); };
    syncSeg(); render();
  };

  const viewProduct = id => {
    const p = byId[id]; if (!p) return viewHome();
    const c = catById[p.cat];
    catNav(p.cat);
    const v = verdictOf(p);
    const allHist = p.offers.flatMap(o => vals(o.hist));

  function drawChart(p, state) {
    const host = $("#chart"); if (!host) return;
    const W = Math.max(300, host.clientWidth), H = W < 520 ? 240 : 300;
    const m = { t: 16, r: 14, b: 28, l: W < 520 ? 48 : 58 };
    const start = Math.max(0, DAYS - state.range);

    const vs = offers.flatMap(o => vals(o.hist.slice(start))).concat([p.msrp]);
    const step = niceStep(Math.max(...vs) - Math.min(...vs) || p.msrp * 0.1);
    const lo = Math.max(0, Math.floor(Math.min(...vs) / step) * step), hi = Math.ceil(Math.max(...vs) / step) * step;

    let g = "";
    for (let v = lo; v <= hi + 1e-6; v += step) {
      g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">$${Math.round(v).toLocaleString()}</text>`;
    }
    const tickEvery = Math.max(1, Math.round((DAYS - 1 - start) / 4));
    for (let i = DAYS - 1; i >= start; i -= tickEvery) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtDate(dateAt(i))}</text>`;

    const ebf = Math.max(start, 72);
    if (MODE === "sample") g += `<rect class="bf" x="${x(ebf)}" y="${m.t}" width="${x(DAYS - 1) - x(ebf)}" height="${H - m.t - m.b}"/>`;
    if (MODE === "sample") g += `<text class="bf-lbl" x="${x(DAYS - 1) - 4}" y="${m.t + 12}" text-anchor="end">Early BF deals</text>`;
    g += `<line class="msrp" x1="${m.l}" x2="${W - m.r}" y1="${y(p.msrp)}" y2="${y(p.msrp)}"/><text x="${m.l + 4}" y="${y(p.msrp) - 5}">MSRP ${money(p.msrp)}</text>`;
    // step lines: later offers (pricier) first so the best sits on top
    [...offers].reverse().forEach(o => {

        if (o.hist[i] == null) { pen = false; continue; }
        const xx = x(i), yy = y(o.hist[i]);
        d += pen ? `H${xx}V${yy}` : `M${xx},${yy}`; pen = true;

      g += `<path d="${d}" fill="none" stroke="var(--chart-surface)" stroke-width="5" stroke-linejoin="round"/>`;
      g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
      g += `<circle cx="${x(DAYS - 1)}" cy="${y(o.now)}" r="4.5" fill="${col}" stroke="var(--chart-surface)" stroke-width="2"/>`;
    });

    g += `<rect id="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;

    const hit = host.querySelector("#hit"), hov = host.querySelector("#hover"), tip = host.querySelector(".tip");
    const move = ev => {
      const r = host.getBoundingClientRect();

      const i = Math.max(start, Math.min(DAYS - 1, Math.round(start + ((px - m.l) / (W - m.l - m.r)) * (DAYS - 1 - start))));

        viewProduct(p.id);
        msg(status === "active" ? `Alert updated. We'll email ${email} when the price hits ${money(target)}.`
          : `Almost done: we're sending a confirmation link to ${email} (it can take up to 15 minutes). Click it to switch the alert on.`, "ok");
      } catch (err) {
        btn.disabled = false; btn.textContent = "Notify me"; msg(err.message, "err");
      }
    });
  }

  function viewAlerts() {
    catNav(null);
    const all = myAlerts();
    const ids = Object.keys(all).sort((a, b) => (all[b].at || 0) - (all[a].at || 0));
    const rows = ids.map(id => {
      const a = all[id], p = byId[id];
      if (!p) return `<div class="alert-row"><div class="art-box"></div><div><h3>Product no longer tracked</h3><div class="meta">Target ${money(a.target)} · ${statusText(a)}</div></div>
        <div class="right"><button class="linkish" data-forget="${esc(id)}">Forget</button></div></div>`;
      const gap = p.best.now - a.target;
      return `<a class="alert-row" href="#p-${p.id}">${artBox(p)}
        <div><h3>${esc(p.brand)} ${esc(p.name)}</h3><div class="meta"><span>Target <b class="num">${money(a.target)}</b></span><span>Best now <b class="num">${money(p.best.now)}</b> at ${storeById[p.best.store].name}</span><span>${statusText(a)}</span></div></div>
        <div class="right">${gap <= 0 ? '<span class="pill good">Target reached</span>' : `<span class="pill neutral">${money(Math.round(gap * 100) / 100)} to go</span>`}</div></a>`;
    });
    $("#view").innerHTML = `
      <div class="crumbs"><a href="#home">All deals</a><span>/</span><span>My alerts</span></div>
      <section>
        <div class="sec-head"><div><span class="eyebrow">Price alerts</span><h1 style="margin-top:8px">My alerts</h1>
          <p>Targets you've set on this device. ${alertsOnline() ? "Email alerts are sent once, when the best price reaches your target. To stop one, use the link in any alert email." : "Email alerts aren't switched on for this site yet; targets are saved on this device."}</p></div></div>
        ${rows.length ? `<div class="alert-list">${rows.join("")}</div>`
          : `<div class="notice" style="margin:0;max-width:none"><h2>No alerts yet</h2><p>Open any product and set a target price under "Price alert". We'll show it here and email you when the price drops to it.</p><a class="btn" href="#home" style="align-self:start">Browse deals</a></div>`}
      </section>`;
    document.querySelectorAll("[data-forget]").forEach(b => b.onclick = () => { const x = myAlerts(); delete x[b.dataset.forget]; saveMyAlerts(x); viewAlerts(); });
  }

  async function viewTokenAction(kind, token) {
    catNav(null);
    const box = (title, body, actions = "") => { $("#view").innerHTML = `<div class="notice"><span class="eyebrow">Price alerts</span><h1>${title}</h1>${body}${actions}</div>`; };
    if (!UUID.test(token)) return box("This link isn't valid", "<p>Copy the whole link from the email into your browser and try again.</p>");
    if (!alertsOnline()) return box("Alerts aren't available here", "<p>Open this link on the DealDrop site itself.</p>");
    box(kind === "confirm" ? "Confirming your alert…" : "Stopping your alert…", "<p>One moment.</p>");
    try {
      if (kind === "confirm") {
        const r = await rpc("dealdrop_confirm_alert", { p_token: token });
        if (!r) return box("This alert can't be confirmed", "<p>It was stopped, or the link is from an older email. Set the alert again on the product page to get a new link.</p>");
        const all = myAlerts(); if (all[r.product_id]) { all[r.product_id].status = "active"; saveMyAlerts(all); }
        box("Alert confirmed", `<p>We'll email you once when <b>${esc(r.product_name)}</b> drops to <b>${money(+r.target_price)}</b> or less.</p>`,
          byId[r.product_id] ? `<a class="btn" href="#p-${esc(r.product_id)}" style="align-self:start">See price history</a>` : "");
      } else {
        const n = await rpc("dealdrop_unsubscribe", { p_token: token, p_all: kind === "unsub-all" });
        box(n ? (kind === "unsub-all" ? "All your alerts are stopped" : "Alert stopped") : "Nothing to stop",
          n ? `<p>${kind === "unsub-all" ? `We stopped ${n} alert${n === 1 ? "" : "s"} and won't email you again unless you set a new one.` : "You won't get emails for this product anymore."}</p>` : "<p>This alert was already stopped.</p>",
          kind === "unsub" ? `<a class="btn secondary" href="#unsub-all-${token}" style="align-self:start">Stop all my alerts</a>` : "");
      }
    } catch (err) { box("Something went wrong", `<p>${esc(err.message)}</p>`); }
  }

  /* ---------- router ---------- */
  const route = () => {
    const h = location.hash.slice(1);
    currentChart = null;
    if (h === "alerts") viewAlerts();
    else if (h === "hot") viewHot();
    else if (h.startsWith("confirm-")) viewTokenAction("confirm", h.slice(8));
    else if (h.startsWith("unsub-all-")) viewTokenAction("unsub-all", h.slice(10));
    else if (h.startsWith("unsub-")) viewTokenAction("unsub", h.slice(6));
    else if (h.startsWith("c-")) viewCat(h.slice(2));
    else if (h.startsWith("p-")) viewProduct(h.slice(2));
    else viewHome();
    window.scrollTo(0, 0);
  };
  window.addEventListener("hashchange", route);

  /* ---------- boot: real prices if available, else sample ---------- */
  (async () => {
    let data = null;
    try { const r = await fetch("data/prices.json", { cache: "no-store" }); if (r.ok) data = await r.json(); } catch (e) {}
    if (!data || !data.products || !data.products.length) { try { data = JSON.parse(document.getElementById("price-data").textContent); } catch (e) {} }
    if (data && data.products && data.products.length && data.dates && data.dates.length) loadLive(data); else loadSample();
    try { const r = await fetch("data/site-config.json", { cache: "no-store" }); if (r.ok) CFG = await r.json(); } catch (e) {}
    try {
      const r = await fetch("data/deals.json", { cache: "no-store" });
      if (r.ok) { HOT_META = await r.json(); HOT = (HOT_META.deals || []).filter(d => !d.expires || new Date(d.expires) > new Date()); hotCatById = Object.fromEntries((HOT_META.categories || []).map(c => [c.id, c])); }
    } catch (e) {}
    if (MODE === "sample" && HOT.length) {          // real deals beat demo data: hide the sample catalog
      PRODUCTS = []; byId = {}; CATS = [];
      $("#foot").textContent = `Deals update around the clock and link straight to the store. ${affiliateOn() ? "DealDrop may earn a commission from purchases made through these links. " : ""}Prices and availability change fast; confirm on the store's site before buying.`;
    }
    updateAlertCount();
    if (MODE === "live") {
      $("#foot").textContent = `Prices from ${storeList()}, checked daily (last check ${new Date(META.updatedAt).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}). Discount = savings against Best Buy's regular price, used as the list price for every store. The 90-day low checks whether a deal is really the cheapest the item has been while we've tracked it. Prices can change at any time; confirm on the store's site before buying.${affiliateOn() ? " DealDrop may earn a commission from purchases made through store links." : ""}${META.amazonAssociate ?" As an Amazon Associate we earn from qualifying purchases. Amazon prices are accurate as of the time shown and are subject to change." : ""}`;
    }
    route();
  })();
})();
</script>
