name: Update hot deals

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}      # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch hot deals from every source
        env:
          FMTC_API_TOKEN: ${{ secrets.FMTC_API_TOKEN }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
        run: node scripts/fetch-deals.mjs
      - name: Commit updated deals
        run: |
          git config user.name "dealdrop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/feed-state.json
          git diff --cached --quiet && echo "No deal changes" && exit 0
          git commit -m "Update hot deals ($(date -u +'%F %H:%M') UTC)"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
