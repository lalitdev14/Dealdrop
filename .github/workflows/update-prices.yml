name: Update Black Friday prices

on:
  schedule:
    - cron: "17 11 * * *"   # once a day, 11:17 UTC
  workflow_dispatch: {}      # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch today's prices
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
          WALMART_PRIVATE_KEY: ${{ secrets.WALMART_PRIVATE_KEY }}
          WALMART_KEY_VERSION: ${{ secrets.WALMART_KEY_VERSION }}
          WALMART_PUBLISHER_ID: ${{ secrets.WALMART_PUBLISHER_ID }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: node scripts/update-prices.mjs
      - name: Commit updated prices
        run: |
          git config user.name "dealdrop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet && echo "No price changes" && exit 0
          git commit -m "Update Black Friday prices ($(date -u +%F))"
          git push
      - name: Email price alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/send-alerts.mjs --price-alerts-only
